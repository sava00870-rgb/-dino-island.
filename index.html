<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Island</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102018;color:white;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;display:flex;gap:7px;flex-wrap:wrap}.pill{background:#07140dcc;border:1px solid #ffffff35;border-radius:12px;padding:8px 10px;font-size:12px}.stats{position:absolute;right:10px;top:10px;width:130px}.bar{height:7px;background:#ffffff35;border-radius:9px;margin:5px 0 8px;overflow:hidden}.fill{height:100%;background:#55d27b;width:100%}.blue{background:#63c9ee}.stick{position:absolute;left:20px;bottom:25px;width:112px;height:112px;border:2px solid #ffffff66;background:#ffffff20;border-radius:50%;pointer-events:auto;touch-action:none}.knob{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:#d9f5dfbb}.buttons{position:absolute;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(2,66px);gap:8px;pointer-events:auto}.buttons button,.start button{border:1px solid #ffffff55;border-radius:14px;background:#173b2c;color:white;padding:12px 5px;font-weight:bold}.hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;text-shadow:0 1px 4px black}.start{position:absolute;inset:0;display:grid;place-items:center;background:#07150fe8;pointer-events:auto}.start>div{margin:20px;max-width:360px;text-align:center;background:#142c20;border:1px solid #ffffff44;border-radius:20px;padding:24px}.start h1{font-size:29px;margin:0}.start p{line-height:1.5;color:#d2e5d6}.start button{background:#28764a;padding:14px 22px;font-size:16px}.hide{display:none}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="top"><div class="pill">🌴 DINO ISLAND</div><div class="pill" id="inv">🪵 0 · 🪨 0 · 🌿 0</div></div><div class="stats pill">❤️ Здоровье<div class="bar"><div id="hp" class="fill"></div></div>⚡ Энергия<div class="bar"><div id="energy" class="fill blue"></div></div></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="buttons"><button id="collect">✋<br>Сбор</button><button id="sprint">⚡<br>Бег</button><button id="attack">🪓<br>Удар</button><button id="look">🧭<br>Цель</button></div><div class="hint">Джойстик — движение · проведи по экрану справа — обзор</div><div class="start" id="start"><div><h1>🦖 DINO ISLAND</h1><p>Исследуй остров, собирай древесину, камень и волокно. Избегай хищника и выживай как можно дольше.</p><p>Телефон: джойстик и кнопки. ПК: WASD, Shift, E, Space.</p><button id="play">НАЧАТЬ</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';
const $=s=>document.getElementById(s),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91bba0);scene.fog=new THREE.Fog(0x91bba0,38,100);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,150);
scene.add(new THREE.HemisphereLight(0xd9f5ff,0x3d4d2e,2));const sun=new THREE.DirectionalLight(0xffe6bd,1.4);sun.position.set(-20,35,15);scene.add(sun);
const material=c=>new THREE.MeshLambertMaterial({color:c});
const ground=new THREE.Mesh(new THREE.CircleGeometry(62,48),material(0x628d4b));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);
const sea=new THREE.Mesh(new THREE.CircleGeometry(95,48),material(0x367d91));sea.rotation.x=-Math.PI/2;sea.position.y=-.35;scene.add(sea);
const trunkGeo=new THREE.CylinderGeometry(.2,.32,2.4,5),crownGeo=new THREE.ConeGeometry(1.45,3,6),rockGeo=new THREE.DodecahedronGeometry(.65,0),bushGeo=new THREE.IcosahedronGeometry(.55,0);
const brown=material(0x65472c),greens=[material(0x28613a),material(0x397744)],stoneMat=material(0x777e79),bushMat=material(0x4e843f);
const resources=[];const rand=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<78;i++){let x=rand(-53,53),z=rand(-53,53);if(x*x+z*z>2850)continue;let g=new THREE.Group(),t=new THREE.Mesh(trunkGeo,brown),c=new THREE.Mesh(crownGeo,greens[i%2]);t.position.y=1.15;c.position.y=3;g.add(t,c);g.position.set(x,0,z);g.rotation.y=rand(0,6);scene.add(g);resources.push({mesh:g,x,z,type:'wood',used:false})}
for(let i=0;i<28;i++){let x=rand(-52,52),z=rand(-52,52);if(x*x+z*z>2800)continue;let m=new THREE.Mesh(rockGeo,stoneMat);m.position.set(x,.4,z);m.scale.set(rand(.8,1.4),rand(.6,1),rand(.8,1.3));scene.add(m);resources.push({mesh:m,x,z,type:'stone',used:false})}
for(let i=0;i<30;i++){let x=rand(-50,50),z=rand(-50,50);if(x*x+z*z>2750)continue;let m=new THREE.Mesh(bushGeo,bushMat);m.position.set(x,.35,z);scene.add(m);resources.push({mesh:m,x,z,type:'fiber',used:false})}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,3,6),material(0x397ca6));body.position.y=.78;const head=new THREE.Mesh(new THREE.SphereGeometry(.27,8,6),material(0xc9946c));head.position.y=1.48;player.add(body,head);scene.add(player);
function makeDino(x,z,aggressive){let g=new THREE.Group(),skin=material(aggressive?0x89513d:0x879b57);let torso=new THREE.Mesh(new THREE.SphereGeometry(1,9,7),skin);torso.scale.set(.8,.6,1.25);torso.position.y=1.1;let h=new THREE.Mesh(new THREE.SphereGeometry(.4,8,6),skin);h.position.set(0,1.35,1.2);let tail=new THREE.Mesh(new THREE.ConeGeometry(.28,1.6,6),skin);tail.rotation.x=-Math.PI/2;tail.position.set(0,1,-1.45);g.add(torso,h,tail);for(let s of [-1,1]){let l=new THREE.Mesh(new THREE.CylinderGeometry(.12,.17,.65,5),skin);l.position.set(s*.38,.35,.1);g.add(l)}g.position.set(x,0,z);scene.add(g);return{mesh:g,home:new THREE.Vector3(x,0,z),aggressive,hp:3,phase:rand(0,7),dead:false}}
const dinos=[makeDino(14,-12,true),makeDino(-23,16,false),makeDino(29,20,false)];
let yaw=0,joy={x:0,y:0},keys={},sprinting=false,started=false,hp=100,energy=100,wood=0,stone=0,fiber=0,elapsed=0;
function hud(){$('hp').style.width=hp+'%';$('energy').style.width=energy+'%';$('inv').textContent='🪵 '+wood+' · 🪨 '+stone+' · 🌿 '+fiber}
function nearest(){let best=null,dist=3.2;for(let r of resources){if(r.used)continue;let d=Math.hypot(r.x-player.position.x,r.z-player.position.z);if(d<dist){dist=d;best=r}}return best}
$('collect').onclick=()=>{let r=nearest();if(!r)return;r.used=true;r.mesh.visible=false;if(r.type==='wood')wood+=2;if(r.type==='stone')stone++;if(r.type==='fiber')fiber+=2;hud()};
$('attack').onclick=()=>{let d=dinos.find(v=>v.aggressive&&!v.dead&&v.mesh.position.distanceTo(player.position)<3.6);if(d){d.hp--;if(d.hp<=0){d.dead=true;scene.remove(d.mesh)}}};
$('sprint').onpointerdown=()=>sprinting=true;$('sprint').onpointerup=$('sprint').onpointercancel=()=>sprinting=false;
$('look').onclick=()=>{let d=dinos.find(v=>v.aggressive&&!v.dead);if(d)yaw=Math.atan2(d.mesh.position.x-player.position.x,d.mesh.position.z-player.position.z)};
$('play').onclick=()=>{$('start').classList.add('hide');started=true};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')$('collect').click();if(e.code==='Space')$('attack').click();if(e.code==='ShiftLeft')sprinting=true});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft')sprinting=false});
let lookId=null,lastX=0;canvas.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.4){lookId=e.pointerId;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(lookId===e.pointerId){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});canvas.addEventListener('pointerup',e=>{if(lookId===e.pointerId)lookId=null});
const stick=$('stick'),knob=$('knob');function joyMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,len=Math.hypot(x,y),k=Math.min(1,44/(len||1));joy.x=x*k/44;joy.y=y*k/44;knob.style.transform='translate('+joy.x*32+'px,'+joy.y*32+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});stick.addEventListener('pointerup',()=>{joy.x=joy.y=0;knob.style.transform='translate(0,0)'});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
const timer=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(timer.getDelta(),.04);if(started){elapsed+=dt;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,m=Math.hypot(f,s);if(m>1){f/=m;s/=m}let fast=sprinting&&energy>1,speed=fast?7:3.8;energy=fast?Math.max(0,energy-25*dt):Math.min(100,energy+13*dt);player.position.x=THREE.MathUtils.clamp(player.position.x+(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt,-58,58);player.position.z=THREE.MathUtils.clamp(player.position.z+(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt,-58,58);player.rotation.y=yaw;
for(let d of dinos){if(d.dead)continue;d.phase+=dt;if(d.aggressive&&d.mesh.position.distanceTo(player.position)<16){let v=player.position.clone().sub(d.mesh.position).normalize();d.mesh.position.addScaledVector(v,1.5*dt);d.mesh.lookAt(player.position.x,0,player.position.z);if(d.mesh.position.distanceTo(player.position)<1.7)hp=Math.max(0,hp-10*dt)}else{d.mesh.position.x=d.home.x+Math.sin(d.phase*.4)*2;d.mesh.position.z=d.home.z+Math.cos(d.phase*.3)*2}}
camera.position.set(player.position.x-Math.sin(yaw)*7,4.5,player.position.z-Math.cos(yaw)*7);camera.lookAt(player.position.x,1,player.position.z);hud();if(hp<=0){started=false;$('start').classList.remove('hide');$('start').querySelector('h1').textContent='ИГРА ОКОНЧЕНА';$('start').querySelector('p').textContent='Хищник настиг тебя. Нажми начать, чтобы начать заново.'}}
renderer.render(scene,camera)}loop();
})();
</script></body></html>
